<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="pure-snow.js" defer></script>
  </head>

  <body>
    <div id="container">
      <div id="snow" data-count="100"></div>
      <div class="block">
        <!-- Names and assignments are filled in by script.js (edit the names array there). -->
        <table>
          <tr>
            <td id="name-0" class="name">&hellip;</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-0" class="assigned">&hellip;</td>
          </tr>
          <tr>
            <td id="name-1" class="name">&hellip;</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-1" class="assigned">&hellip;</td>
          </tr>
          <tr>
            <td id="name-2" class="name">&hellip;</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-2" class="assigned">&hellip;</td>
          </tr>
          <tr>
            <td id="name-3" class="name">&hellip;</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-3" class="assigned">&hellip;</td>
          </tr>
          <tr>
            <td id="name-4" class="name">&hellip;</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-4" class="assigned">&hellip;</td>
          </tr>
          <tr>
            <td id="name-5" class="name">&hellip;</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-5" class="assigned">&hellip;</td>
          </tr>
          <tr>
            <td id="name-6" class="name">&hellip;</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-6" class="assigned">&hellip;</td>
          </tr>
          <tr>
            <td id="name-7" class="name">&hellip;</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-7" class="assigned">&hellip;</td>
          </tr>
        </table>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
