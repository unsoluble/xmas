<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="pure-snow.js" defer></script>
    <style>
      #year-nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.6em;
        margin-top: 1em;
        color: #fff;
        font-family: "Mountains of Christmas", cursive;
        font-weight: 700;
        font-size: 2.2rem;
        line-height: 1;
      }
      #year-nav button {
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        padding: 0 0.3em;
      }
      #year-nav button:hover {
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div id="snow" data-count="100"></div>
      <div class="block">
        <!-- script.js overwrites these cells each year. The values below are the
             2026 pairings, shown only if JavaScript fails to run. -->
        <table>
          <tr>
            <td id="name-0" class="name">Megan</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-0" class="assigned">Jenny</td>
          </tr>
          <tr>
            <td id="name-1" class="name">Mike</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-1" class="assigned">Mom</td>
          </tr>
          <tr>
            <td id="name-2" class="name">Jenny</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-2" class="assigned">John</td>
          </tr>
          <tr>
            <td id="name-3" class="name">Mom</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-3" class="assigned">Mitts</td>
          </tr>
          <tr>
            <td id="name-4" class="name">John</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-4" class="assigned">Alex</td>
          </tr>
          <tr>
            <td id="name-5" class="name">Mitts</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-5" class="assigned">Gino</td>
          </tr>
          <tr>
            <td id="name-6" class="name">Alex</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-6" class="assigned">Megan</td>
          </tr>
          <tr>
            <td id="name-7" class="name">Gino</td>
            <td class="arrow">&#8594;</td>
            <td id="assigned-to-7" class="assigned">Mike</td>
          </tr>
        </table>
      </div>
      <div id="year-nav">
        <button id="year-prev" type="button" aria-label="Previous year">&#8592;</button>
        <span id="year-display">2026</span>
        <button id="year-next" type="button" aria-label="Next year">&#8594;</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
